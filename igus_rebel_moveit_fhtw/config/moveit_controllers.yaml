# MoveIt uses this configuration for controller management

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 2.0  # s; the gripper has no trajectory duration, it needs ~0.5 s
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: false # May lead to unexpectedly aborted goals with scaled JTC

controller_names:
  - rebel_arm_trajectory_controller
  - gripper_controller

rebel_arm_trajectory_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6

# Schunk gripper on DO30 (open) / DO31 (close), served by igus_scene/gripper.py
gripper_controller:
  type: GripperCommand
  action_ns: gripper_cmd
  default: true
  joints:
    - schunk_jaw_left_joint
