controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rebel_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rebel_arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

rebel_arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]

    # Abort instead of pushing forever when the robot does not follow (joint limit, kinematics error, e-stop)
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 3.0
      joint1: { trajectory: 0.5, goal: 0.02 }
      joint2: { trajectory: 0.5, goal: 0.02 }
      joint3: { trajectory: 0.5, goal: 0.02 }
      joint4: { trajectory: 0.5, goal: 0.02 }
      joint5: { trajectory: 0.5, goal: 0.02 }
      joint6: { trajectory: 0.5, goal: 0.02 }

    gains:
      joint1: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint2: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint3: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint4: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint5: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint6: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }

rebel_arm_velocity_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]
